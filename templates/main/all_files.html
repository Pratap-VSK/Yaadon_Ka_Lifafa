<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday 🐼 - Perfect Desktop & Mobile View</title>
<style>
/* ==========================================================================
   GLOBAL RESET & THEME
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#05101e;font-family:Georgia,serif;}

#scene{
  width:100%;height:100vh;
  position:relative;display:flex;justify-content:center;align-items:flex-end;
  overflow:hidden;
}

/* ==========================================================================
   BACKGROUND FX (Rays, Stars, Shadows)
   ========================================================================== */
.ray-layer{
  position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:repeating-conic-gradient(from 0deg,rgba(255,220,80,.04) 0deg 9deg,transparent 9deg 18deg);
  animation:rayRot 100s linear infinite;pointer-events:none;z-index:1;
}
@keyframes rayRot{to{transform:rotate(360deg);}}

.bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;object-fit:cover;}
#fx{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:30;}

/* Stars */
.star{position:absolute;border-radius:50%;background:#fff;animation:twink linear infinite alternate;}
@keyframes twink{0%{opacity:.07;transform:scale(.6);}100%{opacity:.95;transform:scale(1.35);}}

/* Ground Shadow */
#gsh{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:clamp(150px, 35vw, 300px);height:2.5vh;
  background:radial-gradient(ellipse,rgba(0,0,0,.65) 0%,transparent 75%);
  border-radius:50%;z-index:8;opacity:0;transition:opacity .7s, transform .12s ease-out;
}

/* ==========================================================================
   FULLY DYNAMIC & RESPONSIVE PANDA WRAPPER (MOBILE vs DESKTOP)
   ========================================================================== */
/* Default Mobile View: Panda is Big */
#pw{
  position:relative;
  z-index:10;
  width: 95vw; /* Almost full width on mobile for a big cute panda */
  max-width: 450px; /* Restrict max width on tablets */
  max-height: 65vh; /* Keep it away from the title */
  margin-bottom: clamp(10px, 4vh, 30px);
  display: flex;
  justify-content: center;
  align-items: flex-end;
}

/* Desktop/Laptop View: Panda is Smaller to avoid overlapping text */
@media (min-width: 768px) {
  #pw {
    width: 45vw; /* Uses less screen width */
    max-width: 550px; /* Absolute cap on size */
    max-height: 52vh; /* STRICT height limit so it stays low on the screen */
    margin-bottom: 2vh;
  }
}

#pw svg{
  width:100%;
  height:100%;
  max-height:100%;
  overflow:visible;
}

/* Walk-in */
@keyframes walkIn{
  0%  {transform:perspective(1200px) translateZ(-4000px) translateY(-380px) scale(.04);opacity:0;}
  16% {opacity:1;}
  100%{transform:perspective(1200px) translateZ(0) translateY(0) scale(1);opacity:1;}
}

/* Front flip */
@keyframes flip{
  0%  {transform:perspective(1200px) translateY(0)    rotateX(0deg)   scaleY(1);}
  8%  {transform:perspective(1200px) translateY(-3%)  rotateX(20deg)  scaleY(1.07);}
  26% {transform:perspective(1200px) translateY(-46%) rotateX(110deg) scaleY(.86);}
  50% {transform:perspective(1200px) translateY(-58%) rotateX(228deg) scaleY(.80);}
  70% {transform:perspective(1200px) translateY(-20%) rotateX(332deg) scaleY(.88);}
  85% {transform:perspective(1200px) translateY(5%)   rotateX(358deg) scaleY(.76);}
  93% {transform:perspective(1200px) translateY(-2%)  rotateX(360deg) scaleY(1.09);}
  100%{transform:perspective(1200px) translateY(0)    rotateX(360deg) scaleY(1);}
}

/* Breathe */
@keyframes breathe{0%,100%{transform:scaleX(1) scaleY(1);}50%{transform:scaleX(1.016) scaleY(.986);}}
#bm{animation:breathe 3.3s ease-in-out infinite;transform-origin:500px 580px;}

/* Limb Swings for Walking */
@keyframes wLL{0%{transform:rotate(-20deg);}100%{transform:rotate(20deg);}}
@keyframes wRL{0%{transform:rotate(20deg);}100%{transform:rotate(-20deg);}}
@keyframes wLA{0%{transform:rotate(16deg);}100%{transform:rotate(-16deg);}}
@keyframes wRA{0%{transform:rotate(-16deg);}100%{transform:rotate(16deg);}}

.walking #LL{animation:wLL .56s ease-in-out infinite alternate;transform-origin:460px 700px;}
.walking #RL{animation:wRL .56s ease-in-out infinite alternate;transform-origin:540px 700px;}
.walking #LA_grp{animation:wLA .56s ease-in-out infinite alternate;transform-origin:390px 520px;}
.walking #RA_grp{animation:wRA .56s ease-in-out infinite alternate;transform-origin:610px 520px;}

/* Smooth Transitions for Arms */
#LA_grp, #RA_grp { transition: transform 0.35s ease-out; transform-origin: 390px 520px; }
#RA_grp { transform-origin: 610px 520px; }

/* ==========================================================================
   PROPS ANIMATIONS (Floating Balloons & Board)
   ========================================================================== */
@keyframes bunchAirMotion{
  0%  {transform:rotate(-4deg) translateY(0px);}
  50% {transform:rotate(2deg) translateY(-18px);}
  100%{transform:rotate(-4deg) translateY(0px);}
}
#balloon-bunch{transform-origin:272px 600px; opacity:0;}
#balloon-bunch.sway{animation:bunchAirMotion 4.5s ease-in-out infinite;}

/* Prop Pop-In Animation */
@keyframes popIn{
  0%  {opacity:0;transform:scale(.2) translateY(90px);}
  58% {opacity:1;transform:scale(1.07) translateY(-7px);}
  78% {transform:scale(.96) translateY(3px);}
  100%{opacity:1;transform:scale(1) translateY(0);}
}
#bd-grp{opacity:0; transform-origin: 732px 605px;}
#balloon-bunch.show, #bd-grp.show { animation: popIn .78s cubic-bezier(.34,1.56,.64,1) forwards; }

/* ==========================================================================
   REALISTIC WINK ANIMATIONS
   ========================================================================== */
@keyframes closeInnerEye {
  0% { transform: scaleY(1); opacity: 1; }
  100% { transform: scaleY(0); opacity: 0; }
}
@keyframes showClosedLid { 0% { opacity: 0; } 100% { opacity: 1; } }
#left-eye-inner { transform-origin: 428px 346px; }
.wink-inner { animation: closeInnerEye 0.3s forwards ease-in-out; }
.wink-line { animation: showClosedLid 0.3s forwards ease-in-out; }

/* ==========================================================================
   INFINITE FLYING EMOJIS (Hearts & Confetti)
   ========================================================================== */
.hrt{position:absolute;pointer-events:none;opacity:0;animation:fhrt linear forwards;user-select:none;}
@keyframes fhrt{
  0%  {transform:translateY(0) scale(.5) rotate(0deg);opacity:0;}
  8%  {opacity:1;}
  55% {transform:translateY(-45vh) translateX(25px) scale(1.4) rotate(15deg);opacity:.9;}
  100%{transform:translateY(-110vh) translateX(-20px) scale(1.8) rotate(-10deg);opacity:0;}
}

.cft{position:absolute;pointer-events:none;opacity:0;animation:fcft linear forwards;}
@keyframes fcft{
  0%  {transform:translateY(-20px) rotate(0deg);opacity:1;}
  100%{transform:translateY(105vh) rotate(760deg);opacity:0;}
}

/* ==========================================================================
   PREMIUM TITLE, CAKE & TYPOGRAPHY
   ========================================================================== */
#ttl {
  position:absolute;
  top:clamp(15px, 5vh, 40px);
  left:50%;
  transform:translateX(-50%);
  z-index:35;
  opacity:0;
  pointer-events:none;
  text-align:center;
  white-space:nowrap;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}
#ttl.show{animation:tDrop 1s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes tDrop{
  0%  {opacity:0;transform:translateX(-50%) translateY(-65px) scale(.62);}
  100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
}

.title-flex {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(10px, 3vw, 25px);
}

/* 3D Decorated Text */
.t1 {
  font-family: 'Brush Script MT', 'Dancing Script', 'Comic Sans MS', cursive;
  font-size: clamp(2rem, 6vw, 4.2rem);
  color: #FFD700;
  letter-spacing: 2px;
  transform: rotate(-3deg);
  text-shadow: 
    2px 2px 0px #ff1493, 
    4px 4px 0px #8b0045, 
    6px 6px 15px rgba(0,0,0,0.7),
    0px 0px 25px rgba(255, 20, 147, 0.8);
}
.t2 {
  display:block;
  font-size:clamp(0.85rem, 2vw, 1.3rem);
  color:rgba(255,255,255,.9);
  letter-spacing: 3px;
  margin-top: 10px;
  text-shadow: 0px 2px 5px rgba(0,0,0,0.8);
}

/* Realistic SVG Cake Styling */
.real-cake {
  width: clamp(40px, 7vw, 75px);
  height: auto;
  filter: drop-shadow(0px 8px 6px rgba(0,0,0,0.5));
}

/* Animated Candles */
.flame {
  animation: flicker 0.4s infinite alternate ease-in-out;
  transform-origin: center bottom;
}
@keyframes flicker {
  0% { transform: scale(0.9) rotate(-3deg); opacity: 0.8; }
  100% { transform: scale(1.1) rotate(3deg); opacity: 1; }
}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;}}
</style>

<script>
(function(){
  const pw   = document.getElementById('pw');
  const gs   = document.getElementById('gsh');
  const svg  = pw.querySelector('svg');
  const BL   = document.getElementById('balloon-bunch');
  const BD   = document.getElementById('bd-grp');
  const mC   = document.getElementById('mC');
  const mG   = document.getElementById('mG');
  
  const eyeInner = document.getElementById('left-eye-inner');
  const eyeClosedLine = document.getElementById('left-eye-closed');
  
  const ttl  = document.getElementById('ttl');
  const fx   = document.getElementById('fx');
  const scn  = document.getElementById('scene');
  const L_Arm = document.getElementById('LA_grp');
  const R_Arm = document.getElementById('RA_grp');

  /* Background Stars */
  for(let i=0;i<68;i++){
    const s=document.createElement('div'); s.className='star';
    const z=Math.random()*2.5+0.8;
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*56}%;width:${z}px;height:${z}px;animation-duration:${Math.random()*2+1.3}s;animation-delay:${Math.random()*3.8}s;`;
    scn.appendChild(s);
  }

  /* ─── PHASE 1: Walk in ─── */
  svg.classList.add('walking');
  pw.style.animation='walkIn 3.8s cubic-bezier(.2,.6,.34,1) forwards';
  setTimeout(()=>{ gs.style.opacity='0.62'; }, 2100);

  /* ─── PHASE 2: Stop walk, arms rise ─── */
  setTimeout(()=>{
    svg.classList.remove('walking'); 
    L_Arm.style.transform = 'rotate(130deg)';
    R_Arm.style.transform = 'rotate(-130deg)';
  }, 3700);

  /* ─── PHASE 3: FLIP ─── */
  setTimeout(()=>{
    L_Arm.style.transform = 'rotate(35deg)';
    R_Arm.style.transform = 'rotate(-35deg)';
    pw.style.animation='none';
    void pw.offsetWidth; 
    pw.style.animation='flip 1.35s cubic-bezier(.36,.07,.19,.97) forwards';
    
    setTimeout(()=>{ gs.style.transform='translateX(-50%) scaleX(1.55) scaleY(0.3)'; }, 1120);
    setTimeout(()=>{ gs.style.transform='translateX(-50%) scaleX(1) scaleY(1)'; }, 1295);
  }, 4020);

  /* ─── PHASE 4: Drop Arms ─── */
  setTimeout(()=>{
    L_Arm.style.transform = 'rotate(0deg)';
    R_Arm.style.transform = 'rotate(0deg)';
  }, 5200);

  /* ─── PHASE 5: Reveal props ─── */
  setTimeout(()=>{ BL.classList.add('show'); }, 5320);
  setTimeout(()=>{ BD.classList.add('show'); }, 5580);

  /* ─── PHASE 6: Air Sway ─── */
  setTimeout(()=>{ BL.classList.add('sway'); }, 6200);

  /* ─── PHASE 7: Expression + REAL WINK + FX ─── */
  setTimeout(()=>{
    mC.style.display='none';
    mG.style.opacity='1';
    ttl.classList.add('show');
    
    eyeInner.classList.add('wink-inner');
    eyeClosedLine.classList.add('wink-line');

    startHearts();
    startConfetti();
  }, 6400);

  /* ─── INFINITE HEARTS ENGINE ─── */
  const em=['❤️','💖','💗','💝','🎂','🎉','✨','🎈','🌟','🎊'];
  function startHearts(){
    setInterval(()=>{
      const h=document.createElement('div'); h.className='hrt';
      h.textContent=em[Math.floor(Math.random()*em.length)];
      const d=Math.random()*3+3.6, dl=Math.random()*.4;
      h.style.cssText=`left:${Math.random()*84+6}%;bottom:${Math.random()*13+4}%;font-size:clamp(16px, 3vw, 30px);animation-duration:${d}s;animation-delay:${dl}s;`;
      fx.appendChild(h);
      setTimeout(()=>h.remove(),(d+dl)*1000+300);
    }, 200);
  }

  /* ─── INFINITE CONFETTI ENGINE ─── */
  const cc=['#ffd700','#ff2d87','#00aaff','#44dd55','#ff6600','#cc44ff','#ff4444','#44ffcc','#ff88cc','#88ff44'];
  function startConfetti(){
    setInterval(()=>{
      const c=document.createElement('div'); c.className='cft';
      const d=Math.random()*3+2.3;
      const w=Math.random()*7+4, h=Math.random()*12+5;
      c.style.cssText=`left:${Math.random()*100}%;top:-25px;background:${cc[Math.floor(Math.random()*cc.length)]};width:${w}px;height:${h}px;border-radius:${Math.random()>.5?'50%':'3px'};animation-duration:${d}s;transform:rotate(${Math.random()*360}deg);`;
      fx.appendChild(c);
      setTimeout(()=>c.remove(),d*1000+400);
    }, 120);
  }
})();
</script>
