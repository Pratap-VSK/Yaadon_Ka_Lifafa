<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Magic Moment</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a0b2e, #4a154b);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Animation Container */
        #bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        /* Glassmorphism Form Container */
        .creation-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 10;
            animation: fadeIn 1.5s ease-in-out;
            margin: 40px 0;
        }

        .header-text h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            margin-bottom: 5px;
            color: #ff7eb3;
            text-shadow: 0 0 10px #ff7eb3, 0 0 20px #ff7eb3;
        }

        .header-text p {
            font-size: 0.9rem;
            color: #e0e0e0;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff7eb3;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s ease;
        }

        .input-group textarea {
            resize: none;
            top: 15px;
            transform: none;
        }

        .input-group textarea ~ i {
            top: 25px;
        }

        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: #ff7eb3;
            box-shadow: 0 0 10px rgba(255, 126, 179, 0.5);
        }

        /* Media Upload Styling */
        .file-upload-group input[type="file"] {
            display: none;
        }

        .file-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed #ff7eb3;
            padding: 25px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 25px;
        }

        .file-label:hover {
            background: rgba(255, 126, 179, 0.2);
        }

        .file-label i {
            font-size: 2rem;
            color: #ff7eb3;
            margin-bottom: 10px;
        }

        .file-label span {
            font-size: 0.9rem;
            color: #ccc;
        }

        .file-name-display {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #ff758c;
            font-weight: 600;
        }

        /* Submit Button */
        .create-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .create-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 126, 179, 0.4);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .floating-heart {
            position: absolute;
            color: rgba(255, 126, 179, 0.4);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Floating Hearts Background -->
    <div id="bg-animation"></div>

    <div class="creation-container">
        <div class="header-text">
            <h1>Craft Your Love Story ✨</h1>
            <p>Har khoobsurat safar ek choti si yaad se shuru hota hai...</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="magic-form" onsubmit="return validateForm()">
            <!-- Django CSRF Token (Uncomment below line in Django) -->
            <!-- {% csrf_token %} -->
            
            <div class="input-group">
                <i class="fa-solid fa-heart"></i>
                <input type="text" name="partner_names" placeholder="Your Names (e.g. Rahul & Anjali)" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-calendar-days"></i>
                <input type="date" name="anniversary_date" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-pen-fancy"></i>
                <textarea name="special_message" rows="4" placeholder="Write a message that makes their heart smile..." required></textarea>
            </div>

            <!-- Combined Media Upload (Image or Video) -->
            <div class="file-upload-group">
                <label for="media-upload" class="file-label">
                    <i class="fa-solid fa-photo-film"></i>
                    Upload Memory (Image or Video)
                    <span>Max video size: 10MB</span>
                    <div id="file-name" class="file-name-display"></div>
                </label>
                <!-- Accepts both images and videos -->
                <input type="file" id="media-upload" name="memories" accept="image/*, video/*" onchange="checkFileSize(this)">
            </div>

            <button type="submit" class="create-btn">
                Create Magic <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
        </form>
    </div>

    <script>
        // 1. Background Floating Hearts Animation
        function createHearts() {
            const container = document.getElementById('bg-animation');
            const heartCount = 25; // Number of hearts

            for(let i = 0; i < heartCount; i++) {
                let heart = document.createElement('i');
                heart.classList.add('fa-solid', 'fa-heart', 'floating-heart');
                
                // Random properties for natural look
                let size = Math.random() * 25 + 10;
                let leftPos = Math.random() * 100;
                let animDuration = Math.random() * 5 + 5;
                let animDelay = Math.random() * 5;

                heart.style.left = leftPos + 'vw';
                heart.style.fontSize = size + 'px';
                heart.style.animationDuration = animDuration + 's';
                heart.style.animationDelay = animDelay + 's';
                
                container.appendChild(heart);
            }
        }

        // 2. Media File Size Validation (10 MB Limit)
        function checkFileSize(input) {
            const fileNameDisplay = document.getElementById('file-name');
            const maxSizeInMB = 10;
            const maxSizeInBytes = maxSizeInMB * 1024 * 1024;

            if (input.files && input.files[0]) {
                const file = input.files[0];
                
                // Check if file is a video and exceeds 10MB
                if (file.type.startsWith('video/') && file.size > maxSizeInBytes) {
                    alert('Bhai, video ka size 10MB se zyada hai! Please compress it or choose another one.');
                    input.value = ''; // Clear the input
                    fileNameDisplay.textContent = '';
                } else {
                    // Display selected file name
                    fileNameDisplay.textContent = "Selected: " + file.name;
                }
            }
        }

        // Run animations when page loads
        window.onload = createHearts;
    </script>
</body>
</html>
